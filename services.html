/* ════════════════════════════════════════════════════════════
   FIXEO SERVICES PAGE — Premium V2  (svc-v2)
   Self-contained. All selectors prefixed cp-* or svc-*.
   Zero impact on other pages.
   ════════════════════════════════════════════════════════════ */

/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box}

:root {
  --svc-bg:        #09091a;
  --svc-bg-alt:    rgba(255,255,255,0.024);
  --svc-card:      rgba(255,255,255,0.045);
  --svc-border:    rgba(255,255,255,0.08);
  --svc-border-h:  rgba(255,255,255,0.15);
  --svc-muted:     rgba(232,234,240,0.52);
  --svc-muted-2:   rgba(232,234,240,0.34);
  --svc-grad:      linear-gradient(135deg,#E1306C,#833AB4);
  --svc-indigo:    rgb(72,100,255);
  --svc-pink:      #E1306C;
  --svc-purple:    #833AB4;
  --svc-green:     rgba(32,201,151,0.9);
  --svc-amber:     rgba(245,158,11,0.9);
  --svc-sky:       rgba(56,189,248,0.9);
  --svc-radius-lg: 22px;
  --svc-radius-md: 16px;
  --svc-radius-sm: 12px;
}

body {
  margin:0;
  font-family:Cairo,Tajawal,Arial,sans-serif;
  background:linear-gradient(170deg,#07071a 0%,#0d0d20 50%,#0a0a1c 100%);
  color:#e8eaf0;
  min-height:100vh;
  padding-top:70px;
}

a{text-decoration:none}

/* ── Layout container ── */
.cp-container{max-width:1080px;margin:0 auto;padding:0 24px}

/* ── Section rhythm ── */
.cp-section      { padding:72px 0 }
.cp-section-alt  {
  background: var(--svc-bg-alt);
  border-top:  1px solid var(--svc-border);
  border-bottom: 1px solid var(--svc-border);
  padding: 72px 24px;
}

/* ── Section heading ── */
.cp-section-header { text-align:center; margin-bottom:48px }
.cp-section-eyebrow {
  display:inline-block;
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:rgba(225,48,108,0.80);
  margin-bottom:12px;
}
.cp-section-title {
  font-size:clamp(1.4rem,2.8vw,2rem);
  font-weight:800;
  color:#fff;
  margin:0 0 10px;
  letter-spacing:-0.02em;
  line-height:1.2;
}
.cp-section-sub {
  font-size:0.94rem;
  color:var(--svc-muted);
  margin:0 auto;
  max-width:540px;
  line-height:1.65;
}

/* Text gradient */
.hl {
  background:var(--svc-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ════════════════════════════════════════════════════════════
   HERO
   ════════════════════════════════════════════════════════════ */
.cp-hero {
  padding: 88px 24px 80px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.cp-hero::before {
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 50% -10%, rgba(225,48,108,0.14) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 80% 30%, rgba(131,58,180,0.08) 0%, transparent 60%);
  pointer-events:none;
}

.cp-hero-eyebrow {
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 16px;
  border-radius:999px;
  border:1px solid rgba(225,48,108,0.32);
  background:rgba(225,48,108,0.07);
  color:rgba(225,48,108,0.88);
  font-size:0.73rem;
  font-weight:700;
  letter-spacing:0.09em;
  text-transform:uppercase;
  margin-bottom:24px;
}

.cp-hero h1 {
  font-size:clamp(1.9rem,4.5vw,3.2rem);
  font-weight:900;
  line-height:1.1;
  letter-spacing:-0.025em;
  margin:0 0 20px;
  color:#fff;
}

.cp-hero-sub {
  font-size:clamp(1rem,1.8vw,1.15rem);
  color:var(--svc-muted);
  max-width:520px;
  margin:0 auto 16px;
  line-height:1.65;
}

/* Trust strip */
.cp-hero-trust {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 auto 36px;
}

.cp-trust-item {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:0.78rem;
  font-weight:600;
  color:var(--svc-muted);
  white-space:nowrap;
}

.cp-trust-dot {
  width:3px;
  height:3px;
  border-radius:50%;
  background:rgba(255,255,255,0.20);
  flex-shrink:0;
}

.cp-trust-check {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:16px;
  height:16px;
  border-radius:50%;
  background:rgba(32,201,151,0.18);
  color:var(--svc-green);
  font-size:0.62rem;
  font-weight:800;
  flex-shrink:0;
}

/* Buttons */
.cp-btn-row { display:flex;flex-wrap:wrap;gap:12px;justify-content:center }

.cp-btn {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 28px;
  border-radius:var(--svc-radius-sm);
  font-size:0.96rem;
  font-weight:800;
  cursor:pointer;
  border:none;
  text-decoration:none;
  transition:transform 0.15s,box-shadow 0.15s,filter 0.15s;
  color:#fff;
  letter-spacing:0.01em;
}
.cp-btn:hover { transform:translateY(-2px) }

.cp-btn-primary {
  background:var(--svc-grad);
  box-shadow:0 8px 24px rgba(225,48,108,0.26);
}
.cp-btn-primary:hover {
  box-shadow:0 12px 32px rgba(225,48,108,0.38);
  filter:brightness(1.06);
}

.cp-btn-outline {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.13);
}
.cp-btn-outline:hover { background:rgba(255,255,255,0.11) }

/* ════════════════════════════════════════════════════════════
   SERVICE CARDS
   ════════════════════════════════════════════════════════════ */
.cp-service-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.cp-svc-card {
  background:var(--svc-card);
  border:1px solid var(--svc-border);
  border-radius:var(--svc-radius-lg);
  padding:26px 22px 22px;
  display:flex;
  flex-direction:column;
  transition:transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  position:relative;
  overflow:hidden;
}

.cp-svc-card::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:radial-gradient(ellipse 60% 40% at 50% 0%, rgba(225,48,108,0.06) 0%, transparent 70%);
  opacity:0;
  transition:opacity 0.22s ease;
  pointer-events:none;
}

.cp-svc-card:hover {
  transform:translateY(-4px);
  border-color:rgba(225,48,108,0.30);
  box-shadow:0 16px 40px rgba(0,0,0,0.26), 0 0 0 1px rgba(225,48,108,0.08);
}
.cp-svc-card:hover::before { opacity:1 }

/* Icon box */
.cp-svc-icon-box {
  width:52px;
  height:52px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.09);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
  font-size:1.5rem;
  flex-shrink:0;
  transition:background 0.18s, border-color 0.18s;
}
.cp-svc-card:hover .cp-svc-icon-box {
  background:rgba(225,48,108,0.12);
  border-color:rgba(225,48,108,0.22);
}

.cp-svc-name {
  font-size:1.05rem;
  font-weight:800;
  color:#fff;
  margin:0 0 7px;
  letter-spacing:-0.01em;
}

.cp-svc-desc {
  font-size:0.84rem;
  color:var(--svc-muted);
  margin:0 0 8px;
  line-height:1.58;
  flex:1;
}

.cp-svc-example {
  font-size:0.76rem;
  color:var(--svc-muted-2);
  font-style:italic;
  margin:0 0 16px;
  line-height:1.5;
  padding-left:0;
}

.cp-svc-cta {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:0.82rem;
  font-weight:700;
  color:rgba(225,48,108,0.88);
  padding:8px 16px;
  border-radius:10px;
  border:1px solid rgba(225,48,108,0.20);
  background:rgba(225,48,108,0.06);
  transition:background 0.15s, color 0.15s, border-color 0.15s;
  cursor:pointer;
  align-self:flex-start;
  min-height:40px;
}
.cp-svc-cta:hover {
  background:rgba(225,48,108,0.14);
  border-color:rgba(225,48,108,0.35);
  color:#fff;
}
.cp-svc-cta-arrow {
  font-size:0.9rem;
  transition:transform 0.15s;
  font-style:normal;
}
.cp-svc-cta:hover .cp-svc-cta-arrow { transform:translateX(3px) }

/* ════════════════════════════════════════════════════════════
   URGENCE / PLANIFIÉ SPLIT
   ════════════════════════════════════════════════════════════ */
.cp-split {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  align-items:stretch;
}

.cp-split-card {
  border-radius:var(--svc-radius-lg);
  padding:32px 28px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:relative;
  overflow:hidden;
}

/* Urgence: warm glow */
.cp-split-card--urgent {
  background:linear-gradient(145deg, rgba(225,48,108,0.12) 0%, rgba(131,58,180,0.08) 100%);
  border:1px solid rgba(225,48,108,0.28);
  box-shadow:0 0 0 1px rgba(225,48,108,0.06), 0 8px 32px rgba(225,48,108,0.08);
}
.cp-split-card--urgent::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, rgba(225,48,108,0.7), transparent);
}

/* Planifié: cool */
.cp-split-card--planned {
  background:linear-gradient(145deg, rgba(56,189,248,0.07) 0%, rgba(72,100,255,0.06) 100%);
  border:1px solid rgba(56,189,248,0.22);
  box-shadow:0 0 0 1px rgba(56,189,248,0.05), 0 8px 32px rgba(56,189,248,0.05);
}
.cp-split-card--planned::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, rgba(56,189,248,0.55), transparent);
}

.cp-split-badge {
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:4px 13px;
  border-radius:999px;
  font-size:0.71rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.07em;
  margin-bottom:14px;
  width:fit-content;
}

.cp-split-badge-urgent {
  background:rgba(225,48,108,0.16);
  color:rgba(255,100,150,0.95);
  border:1px solid rgba(225,48,108,0.28);
}

.cp-split-badge-planned {
  background:rgba(56,189,248,0.12);
  color:rgba(56,189,248,0.92);
  border:1px solid rgba(56,189,248,0.22);
}

.cp-split-icon {
  font-size:2rem;
  margin-bottom:8px;
  display:block;
  line-height:1;
}

.cp-split-title {
  font-size:1.15rem;
  font-weight:800;
  color:#fff;
  margin:0 0 10px;
  letter-spacing:-0.01em;
}

.cp-split-text {
  font-size:0.88rem;
  color:var(--svc-muted);
  margin:0 0 20px;
  line-height:1.65;
  flex:1;
}

.cp-split-bullets {
  list-style:none;
  padding:0;
  margin:0 0 24px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.cp-split-bullets li {
  font-size:0.83rem;
  color:var(--svc-muted);
  display:flex;
  align-items:center;
  gap:8px;
}

.cp-split-bullets li::before {
  content:'';
  width:5px;
  height:5px;
  border-radius:50%;
  flex-shrink:0;
}

.cp-split-card--urgent .cp-split-bullets li::before {
  background:rgba(225,48,108,0.7);
}
.cp-split-card--planned .cp-split-bullets li::before {
  background:rgba(56,189,248,0.7);
}

.cp-split-btn-urgent {
  background:var(--svc-grad);
  box-shadow:0 8px 20px rgba(225,48,108,0.24);
  align-self:flex-start;
}
.cp-split-btn-urgent:hover {
  box-shadow:0 12px 28px rgba(225,48,108,0.36);
}

.cp-split-btn-planned {
  background:rgba(56,189,248,0.12);
  border:1px solid rgba(56,189,248,0.28);
  color:rgba(56,189,248,0.94);
  align-self:flex-start;
}
.cp-split-btn-planned:hover {
  background:rgba(56,189,248,0.20);
}

/* ════════════════════════════════════════════════════════════
   PRICE ESTIMATE GRID
   ════════════════════════════════════════════════════════════ */
.cp-price-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
  margin-bottom:20px;
}

.cp-price-card {
  background:var(--svc-card);
  border:1px solid var(--svc-border);
  border-radius:var(--svc-radius-md);
  padding:20px 18px;
  transition:border-color 0.18s, transform 0.18s;
}
.cp-price-card:hover {
  border-color:var(--svc-border-h);
  transform:translateY(-2px);
}

.cp-price-service {
  font-size:0.9rem;
  font-weight:700;
  color:rgba(255,255,255,0.82);
  margin:0 0 8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.cp-price-icon {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:8px;
  background:rgba(255,255,255,0.06);
  font-size:0.9rem;
  flex-shrink:0;
}

.cp-price-range {
  font-size:1.25rem;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.02em;
  margin:0 0 5px;
}

.cp-price-unit {
  font-size:0.8rem;
  font-weight:600;
  color:rgba(225,48,108,0.8);
  margin-left:4px;
}

.cp-price-note {
  font-size:0.76rem;
  color:var(--svc-muted-2);
  margin:0;
  line-height:1.4;
}

.cp-price-disclaimer {
  margin:24px auto 0;
  max-width:560px;
  text-align:center;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;
  padding:14px 20px;
  font-size:0.81rem;
  color:var(--svc-muted-2);
  line-height:1.55;
}

.cp-price-disclaimer strong {
  color:rgba(32,201,151,0.80);
  font-weight:700;
}

/* ════════════════════════════════════════════════════════════
   WHY FIXEO — FEATURE CARDS
   ════════════════════════════════════════════════════════════ */
.cp-feat-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.cp-feat-card {
  background:var(--svc-card);
  border:1px solid var(--svc-border);
  border-radius:var(--svc-radius-lg);
  padding:26px 22px;
  transition:border-color 0.18s, transform 0.18s;
  position:relative;
  overflow:hidden;
}
.cp-feat-card:hover {
  border-color:var(--svc-border-h);
  transform:translateY(-2px);
}

.cp-feat-icon-box {
  width:46px;
  height:46px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  font-size:1.25rem;
  font-style:normal;
  flex-shrink:0;
}

/* Per-card icon accent colors */
.cp-feat-icon-box--green  { background:rgba(32,201,151,0.14); border:1px solid rgba(32,201,151,0.20); }
.cp-feat-icon-box--blue   { background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.18); }
.cp-feat-icon-box--purple { background:rgba(131,58,180,0.14); border:1px solid rgba(131,58,180,0.20); }
.cp-feat-icon-box--pink   { background:rgba(225,48,108,0.12); border:1px solid rgba(225,48,108,0.18); }

.cp-feat-title {
  font-size:1rem;
  font-weight:800;
  color:#fff;
  margin:0 0 8px;
  letter-spacing:-0.01em;
}

.cp-feat-text {
  font-size:0.84rem;
  color:var(--svc-muted);
  margin:0;
  line-height:1.6;
}

/* ════════════════════════════════════════════════════════════
   FINAL CTA BAND
   ════════════════════════════════════════════════════════════ */
.cp-cta-band {
  padding:80px 24px 88px;
  text-align:center;
  background:
    radial-gradient(ellipse 60% 50% at 30% 50%, rgba(225,48,108,0.10) 0%, transparent 65%),
    radial-gradient(ellipse 50% 45% at 70% 50%, rgba(131,58,180,0.08) 0%, transparent 60%);
  border-top:1px solid rgba(255,255,255,0.07);
  position:relative;
  overflow:hidden;
}

.cp-cta-band::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(225,48,108,0.4),rgba(131,58,180,0.3),transparent);
}

.cp-cta-band-eyebrow {
  display:inline-block;
  font-size:0.70rem;
  font-weight:700;
  letter-spacing:0.11em;
  text-transform:uppercase;
  color:rgba(225,48,108,0.70);
  margin-bottom:14px;
}

.cp-cta-band h2 {
  font-size:clamp(1.5rem,3.5vw,2.4rem);
  font-weight:900;
  color:#fff;
  margin:0 0 12px;
  letter-spacing:-0.025em;
  line-height:1.15;
}

.cp-cta-band p {
  font-size:1rem;
  color:var(--svc-muted);
  max-width:460px;
  margin:0 auto 32px;
  line-height:1.65;
}

.cp-cta-band-guarantee {
  margin-top:16px;
  font-size:0.76rem;
  color:var(--svc-muted-2);
  letter-spacing:0.01em;
}

/* ════════════════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════════════════ */
@media (max-width:768px) {
  .cp-hero         { padding:60px 16px 56px }
  .cp-section      { padding:52px 0 }
  .cp-section-alt  { padding:52px 16px }
  .cp-split        { grid-template-columns:1fr; gap:16px }

  --fxsvc-step: 110,130,255;

  position: relative;
  overflow: hidden;

  padding: 22px 22px 20px;

  border-radius: 20px;

  background:
    linear-gradient(
      155deg,
      rgba(var(--fxsvc-step),0.055) 0%,
      rgba(255,255,255,0.038) 35%,
      rgba(255,255,255,0.018) 100%
    );

  border: 1px solid rgba(255,255,255,0.085);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 10px 30px rgba(0,0,0,0.18);

  transition:
    transform 0.16s ease,
    border-color 0.16s ease,
    box-shadow 0.16s ease;
}

.fxsvc-process-card:nth-child(1) {
  --fxsvc-step: 108,123,255;
}

.fxsvc-process-card:nth-child(2) {
  --fxsvc-step: 56,189,248;
}

.fxsvc-process-card:nth-child(3) {
  --fxsvc-step: 168,85,247;
}

.fxsvc-process-card:nth-child(4) {
  --fxsvc-step: 225,48,108;
}

.fxsvc-process-card::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse 75% 48% at 10% 0%,
      rgba(var(--fxsvc-step),0.085) 0%,
      transparent 72%
    );
}

.fxsvc-process-card:hover {
  transform: translateY(-2px);

  border-color: rgba(var(--fxsvc-step),0.20);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.075),
    0 15px 38px rgba(0,0,0,0.24);
}


/* ── Card header ───────────────────────────────────────── */

.fxsvc-process-card-head {
  position: relative;
  z-index: 1;

  display: flex;
  align-items: center;
  gap: 11px;

  margin-bottom: 16px;
}

.fxsvc-process-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;

  border-radius: 12px;

  border: 1px solid rgba(var(--fxsvc-step),0.35);

  background:
    linear-gradient(
      145deg,
      rgba(var(--fxsvc-step),0.20),
      rgba(var(--fxsvc-step),0.08)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 4px 14px rgba(var(--fxsvc-step),0.08);

  color: rgba(245,248,255,0.96);

  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.03em;
}

.fxsvc-process-kicker {
  font-size: 0.68rem;
  line-height: 1;
  font-weight: 800;
  letter-spacing: 0.13em;
  color: rgba(170,255,210,0.90);
}


/* ── Card content ──────────────────────────────────────── */

.fxsvc-process-card h3 {
  position: relative;
  z-index: 1;

  margin: 0 0 7px;

  color: rgba(248,250,255,0.96);

  font-size: 1.02rem;
  line-height: 1.3;
  font-weight: 800;
  letter-spacing: -0.018em;
}

.fxsvc-process-desc {
  position: relative;
  z-index: 1;

  margin: 0 0 15px;

  font-size: 0.80rem;
  line-height: 1.55;

  color: rgba(205,215,235,0.52);
}


/* ── Structured points ─────────────────────────────────── */

.fxsvc-process-points {
  position: relative;
  z-index: 1;

  list-style: none;

  margin: 0;
  padding: 0;

  display: flex;
  flex-direction: column;
  gap: 7px;
}

.fxsvc-process-points li {
  display: flex;
  align-items: center;
  gap: 9px;

  font-size: 0.79rem;
  line-height: 1.4;
  font-weight: 600;

  color: rgba(232,238,248,0.76);
}

.fxsvc-process-points li::before {
  content: '';

  width: 5px;
  height: 5px;

  flex: 0 0 5px;

  border-radius: 50%;

  background: rgba(var(--fxsvc-step),0.85);

  box-shadow:
    0 0 0 3px rgba(var(--fxsvc-step),0.08);
}


/* ── Outcome ───────────────────────────────────────────── */

.fxsvc-process-outcome {
  max-width: 820px;

  margin: 18px auto 0;
  padding: 12px 15px;

  display: flex;
  align-items: flex-start;
  gap: 10px;

  border-radius: 12px;

  background: rgba(255,255,255,0.025);

  border: 1px solid rgba(255,255,255,0.065);
}

.fxsvc-process-outcome-dot {
  width: 7px;
  height: 7px;

  margin-top: 6px;

  flex: 0 0 7px;

  border-radius: 50%;

  background: rgba(32,201,151,0.82);

  box-shadow: 0 0 0 4px rgba(32,201,151,0.08);
}

.fxsvc-process-outcome p {
  margin: 0;

  font-size: 0.76rem;
  line-height: 1.55;

  color: rgba(195,207,230,0.50);
}

.fxsvc-process-outcome strong {
  color: rgba(226,235,248,0.76);
  font-weight: 700;
}


/* ── Mobile ────────────────────────────────────────────── */

@media (max-width: 639px) {

  .fxsvc-process-header {
    margin-bottom: 26px;
  }

  .fxsvc-process-intro {
    margin-bottom: 16px;
  }

  .fxsvc-process-intro-label {
    font-size: 0.62rem;
  }

  .fxsvc-process-intro p {
    font-size: 0.88rem;
    line-height: 1.5;
  }

  .fxsvc-process-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .fxsvc-process-card {
    padding: 17px 16px 16px;
    border-radius: 17px;
  }

  .fxsvc-process-card-head {
    gap: 9px;
    margin-bottom: 12px;
  }

  .fxsvc-process-num {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 0.68rem;
  }

  .fxsvc-process-kicker {
    font-size: 0.63rem;
  }

  .fxsvc-process-card h3 {
    font-size: 0.92rem;
    margin-bottom: 5px;
  }

  .fxsvc-process-desc {
    font-size: 0.75rem;
    margin-bottom: 12px;
  }

  .fxsvc-process-points {
    gap: 5px;
  }

  .fxsvc-process-points li {
    font-size: 0.74rem;
    gap: 8px;
  }

  .fxsvc-process-outcome {
    margin-top: 12px;
    padding: 10px 12px;
  }

  .fxsvc-process-outcome p {
    font-size: 0.71rem;
  }
}


/* ── Reduced motion ────────────────────────────────────── */

@media (prefers-reduced-motion: reduce) {

  .fxsvc-process-card,
  .fxsvc-process-card:hover {
    transition: none;
    transform: none;
  }

}

  <div class="cp-container">

      <h2 class="cp-section-title" id="fxsvc-process-title">

      <p>

      </p>
    </div>

    <div class="fxsvc-process-grid">

      <article class="fxsvc-process-card">

        </div>

        <p class="fxsvc-process-desc">
          Le besoin est mieux qualifié dès le départ.
        </p>

        <ul class="fxsvc-process-points">
          <li>Métier recherché</li>
          <li>Contexte du problème</li>
          <li>Niveau d’urgence</li>
        </ul>
      </article>

      <article class="fxsvc-process-card">
        <div class="fxsvc-process-card-head">
          <span class="fxsvc-process-num">02</span>

        </div>

        <h3>Contextualiser l’intervention</h3>

        <p class="fxsvc-process-desc">
          La localisation permet de rapprocher la demande du territoire pertinent.
        </p>

        <ul class="fxsvc-process-points">
          <li>Ville concernée</li>
          <li>Zone d’intervention</li>
          <li>Accès et déplacement</li>
        </ul>
      </article>

      <!-- 03 — PROFIL -->
      <article class="fxsvc-process-card">
        <div class="fxsvc-process-card-head">
          <span class="fxsvc-process-num">03</span>
          <span class="fxsvc-process-kicker">PROFIL</span>
        </div>

        <h3>Identifier les profils pertinents</h3>

        <p class="fxsvc-process-desc">
          Les informations disponibles orientent la demande vers des professionnels adaptés.
        </p>

        <ul class="fxsvc-process-points">
          <li>Spécialité correspondante</li>
          <li>Zone couverte</li>
          <li>Informations consultables</li>
        </ul>
      </article>

      <article class="fxsvc-process-card">
        <div class="fxsvc-process-card-head">
          <span class="fxsvc-process-num">04</span>
          <span class="fxsvc-process-kicker">MISSION</span>
        </div>

        <h3>Organiser la suite</h3>

        <p class="fxsvc-process-desc">

          <li>Besoin structuré</li>
          <li>Disponibilité à confirmer</li>
          <li>Intervention à organiser</li>
        </ul>
      </article>

    </div>

    <div class="fxsvc-process-outcome">
      <span class="fxsvc-process-outcome-dot" aria-hidden="true"></span>
      <p>
        <strong>Objectif du parcours :</strong>
        réduire le flou entre le besoin exprimé et l’organisation de l’intervention.
      </p>
    </div>

  </div>
</section>
