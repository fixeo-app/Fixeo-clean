name: Mobile Gate A
on:
  push:
    branches: [feat/fixeo-mobile-m1-m3-owner]
    paths: ['mobile/**', '.github/workflows/mobile-gate-a.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-gate-a.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npx expo-doctor@1.20.4
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir dist-gate-a
