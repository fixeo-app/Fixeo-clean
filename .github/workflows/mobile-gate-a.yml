name: Mobile Gate A
on:
  push:
    branches: [feat/fixeo-mobile-gate-ab]
    paths: ['mobile/**', '.github/workflows/mobile-gate-a.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-gate-a.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo-doctor@latest
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir dist-gate-a
