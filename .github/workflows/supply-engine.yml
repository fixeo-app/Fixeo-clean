name: Supply Engine certification

on:
  push:
    branches: [feat/supply-engine-agent-foundation, feat/supply-b8-b10-recruitment-agent-v1, feat/national-supply-b11-b13, fix/supply-control-resilient-loading, fix/supply-agents-rpc-bigint]
    paths:
      - 'supabase/migrations/*supply_b*'
      - 'api/supply-agent-fn/**'
      - 'js/admin-supply-engine.js'
      - 'css/admin-supply-engine.css'
      - 'admin.html'
      - 'js/admin-control-os-clean.js'
      - 'vercel.json'
      - 'tests/supply-engine/**'
      - '.github/workflows/supply-engine.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*supply_b*'
      - 'api/supply-agent-fn/**'
      - 'js/admin-supply-engine.js'
      - 'css/admin-supply-engine.css'
      - 'admin.html'
      - 'js/admin-control-os-clean.js'
      - 'vercel.json'
      - 'tests/supply-engine/**'
      - '.github/workflows/supply-engine.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: supply_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/control-contract
      - run: node --check api/supply-agent-fn/index.js
      - run: node --check js/admin-supply-engine.js
      - run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - run: node --test --test-concurrency=1 tests/supply-engine/supply-engine.test.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/tests/control-contract/node_modules
          SUPPLY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/supply_engine
