name: Control contract isolated certification
on:
  push:
    branches: [feat/control-os-bloc1-contract]
  pull_request:
    paths:
      - 'api/control/**'
      - 'tests/control-contract/**'
      - 'supabase/migrations/*control_os_b1*'
      - '.github/workflows/control-contract.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: control_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/control-contract
      - run: npm test
        working-directory: tests/control-contract
        env:
          CONTROL_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/control_contract
