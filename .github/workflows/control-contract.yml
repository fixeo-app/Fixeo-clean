name: Control contract isolated certification
on:
  push:
    branches: [feat/control-os-bloc1-contract, feat/control-os-bloc2-rafi-decision-center]
  pull_request:
    paths:
      - 'supabase/migrations/*mobile_w5*'
      - 'api/control/**'
      - 'tests/control-contract/**'
      - 'tests/admin-control-os/cross-universe-contract.test.cjs'
      - 'supabase/migrations/*control_os_b1*'
      - 'supabase/migrations/*control_os_b2*'
      - 'supabase/migrations/*control_os_b34*'
      - 'supabase/migrations/*control_os_b5*'
      - 'supabase/migrations/*control_os_b6*'
      - 'supabase/migrations/*control_os_b7*'
      - 'js/admin-fixeo-*.js'
      - 'css/admin-fixeo-dossier-operations.css'
      - 'css/admin-fixeo-registers.css'
      - 'css/admin-fixeo-intelligence.css'
      - 'js/admin-rafi-*.js'
      - 'js/fixeo-control-client-v1.js'
      - 'js/admin-control-os-clean.js'
      - 'js/admin-control-command-ux.js'
      - 'js/admin-control-observability.js'
      - 'css/admin-control-command-ux.css'
      - 'docs/control-os/bloc8/**'
      - 'admin.html'
      - 'admin-control-os.html'
      - 'css/admin-rafi-decision-center.css'
      - 'seo/**'
      - 'blog/**'
      - 'blog-index.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'vercel.json'
      - 'vercel.ts'
      - 'vercel.legacy.json'
      - 'scripts/generate-blog-v2.js'
      - 'scripts/generate-authority-blog-v3.js'
      - 'scripts/generate-profile-sitemap.js'
      - 'api/artisan-profile-fn/**'
      - 'api/dispatch-whatsapp-worker-fn/**'
      - 'api/whatsapp-webhook-fn/**'
      - 'tests/whatsapp-precutover/**'
      - 'supabase/migrations/*whatsapp_precutover*'
      - 'supabase/migrations/*enterprise_provisioning*'
      - 'js/admin-enterprise-provisioning.js'
      - 'css/admin-enterprise-provisioning.css'
      - 'js/fixeo-enterprise-invitation.js'
      - 'tests/enterprise-provisioning/**'
      - '.github/workflows/control-contract.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: control_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/control-contract
      - run: npm test
        working-directory: tests/control-contract
        env:
          CONTROL_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/control_contract
      - run: node --test tests/admin-control-os/cross-universe-contract.test.cjs
      - run: node --test seo/generators/seo-consolidation-v1.test.js
      - run: |
          node --check seo/generators/service-city-v3.js
          node --check scripts/generate-blog-v2.js
          node --check scripts/generate-authority-blog-v3.js
          node --check scripts/generate-profile-sitemap.js
          node --check api/artisan-profile-fn/index.js
          node --test tests/whatsapp-precutover/whatsapp-precutover.test.cjs

      - run: npx playwright install --with-deps chromium
        working-directory: tests/control-contract
      - run: node tests/control-contract/browser.cjs
      - run: node tests/control-contract/browser-bloc5.cjs
      - run: node tests/control-contract/browser-bloc6.cjs
      - run: node tests/control-contract/browser-bloc7.cjs
      - run: node tests/control-contract/browser-bloc8.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-bloc34-browser
          path: docs/control-os/bloc34/evidence/browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-bloc5-browser
          path: docs/control-os/bloc5/evidence/browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-bloc6-browser
          path: docs/control-os/bloc6/evidence/browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-bloc7-browser
          path: docs/control-os/bloc7/evidence/browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-bloc8-browser
          path: docs/control-os/bloc8/evidence/browser/
